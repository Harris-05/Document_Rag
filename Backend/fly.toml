# Fly.io configuration for the backend. Set `app` to the name you pick in `fly launch`, and create the
# volume named below before the first deploy (see "Deploying" in the README).
app = "marginalia-api"
primary_region = "fra"

[build]

[env]
  DATA_DIR = "/data"
  MAX_UPLOAD_MB = "25"
  # Replace with your Vercel address once the frontend exists, e.g. https://marginalia.vercel.app
  # (comma-separate several). The OpenAI key is NOT here: set it with `fly secrets set`.
  CORS_ORIGINS = "https://marginalia.vercel.app"

[mounts]
  source = "marginalia_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # One always-on machine: the database lives on its volume, and a cold start would make the first
  # request of a review session slow.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
